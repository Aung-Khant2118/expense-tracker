<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFlow · Personal Expense Tracker</title>
    <meta
      name="description"
      content="A private, browser-based expense tracker for daily transactions, monthly balances, and spending patterns."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <meta property="og:title" content="FinFlow · Personal Expense Tracker" />
    <meta
      property="og:description"
      content="A private, browser-based expense tracker for daily transactions, monthly balances, and spending patterns."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before paint to avoid a light flash.
      try {
        var theme = localStorage.getItem('ledger_theme_v1');
        if (!theme) {
          var saved = JSON.parse(localStorage.getItem('expense_tracker_settings_v1') || '{}');
          theme = saved.theme;
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#161616');
        }
      } catch (e) {
        /* ignore corrupt storage */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
